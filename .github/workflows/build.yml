name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip source code
      run: |
        echo "Extracting archive..."
        unzip -o arsenal_1_11_1.zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 7.6
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '7.6'
        cache-disabled: true

    - name: Build with Gradle
      run: |
        # Ищем build.gradle (даже в подпапках) и переходим туда
        TARGET_FILE=$(find . -name "build.gradle" | head -n 1)
        BUILD_DIR=$(dirname "$TARGET_FILE")
        echo "Found project dir: $BUILD_DIR"
        cd "$BUILD_DIR"
        gradle build

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arsenal-Mod
        path: "**/build/libs/*.jar"
