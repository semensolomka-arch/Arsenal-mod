name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip source code
      run: |
        mkdir -p source_code
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        echo "Unpacking: $ZIP_FILE"
        unzip -o "$ZIP_FILE" -d source_code || true
        # Покажем, что у нас вообще распаковалось (для отладки в логах)
        ls -R source_code

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 7.6
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '7.6'
        cache-disabled: true

    - name: Build with Gradle
      run: |
        # Ищем build.gradle во всех подпапках
        BUILD_PATH=$(find . -name "build.gradle" | head -n 1)
        BUILD_DIR=$(dirname "$BUILD_PATH")
        echo "Found project dir: $BUILD_DIR"
        cd "$BUILD_DIR"
        gradle build
        
    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arsenal-Mod
        path: "**/build/libs/*.jar"



