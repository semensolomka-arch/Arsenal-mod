name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip source code
      run: unzip -o arsenal_1_11_0.zip || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        # Находим папку, в которой лежит build.gradle
        BUILD_DIR=$(find . -name "build.gradle" -exec dirname {} \;)
        echo "Found project dir: $BUILD_DIR"
        cd "$BUILD_DIR"
        
        # Если есть gradlew, даём права и запускаем его, иначе используем системный gradle
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew build
        else
          gradle build
        fi

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Arsenal-Mod
        path: "**/build/libs/*.jar"
